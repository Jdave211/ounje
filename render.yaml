services:
  - name: ounje-api
    type: web
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    buildFilter:
      paths:
        - package.json
        - render.yaml
        - server/**
        - supabase/migrations/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: OUNJE_RUNTIME_ENV
        value: production
      - key: OUNJE_PUBLIC_BASE_URL
        value: https://ounje-recipe.vercel.app
      - key: OUNJE_ENABLE_RECIPE_INGESTION_POLLING
        value: "false"
      - key: YOUTUBE_DL_SKIP_DOWNLOAD
        value: "true"
      - key: OUNJE_ENABLE_AI_CALL_LOGGING
        value: "true"
      - key: AUTOSHOP_MANUAL_BETA_ONLY
        value: "true"
      - key: OUNJE_AI_DAILY_SPEND_LIMIT_USD
        value: "8"
      - key: OUNJE_AI_USER_DAILY_SPEND_LIMIT_USD
        value: "3"
      - key: APNS_BUNDLE_ID
        value: net.ounje
      - key: APNS_KEY_ID
        value: US3DPZX54S
      - key: APNS_TEAM_ID
        value: U8FPZXV6X6
      - key: OPENAI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: KROGER_CLIENT_ID
        sync: false
      - key: KROGER_CLIENT_SECRET
        sync: false
      - key: BROWSER_USE_API_KEY
        sync: false
      - key: LUMBOX_API_KEY
        sync: false
      - key: AGENTSIM_API_KEY
        sync: false
      - key: IFRAMELY_API_KEY
        sync: false
      - key: TWO_CAPTCHA_API_KEY
        sync: false
      - key: RECIPE_IMAGE_BUCKET
        sync: false
      - key: APNS_KEY_BASE64
        sync: false
      - key: OUNJE_FOUNDER_SLACK_WEBHOOK_URL
        sync: false
  - name: ounje-recipe-ingestion
    type: worker
    runtime: docker
    plan: starter
    dockerfilePath: Dockerfile
    dockerCommand: node server/scripts/recipe_ingestion_worker.mjs --worker-id render_recipe_ingest --batch-size 2 --wake-mode redis --wake-timeout-ms 15000
    maxShutdownDelaySeconds: 300
    autoDeploy: true
    buildFilter:
      paths:
        - Dockerfile
        - .dockerignore
        - package.json
        - render.yaml
        - server/**
        - supabase/migrations/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: OUNJE_RUNTIME_ENV
        value: production
      - key: OUNJE_ENABLE_AI_CALL_LOGGING
        value: "true"
      - key: RECIPE_INGESTION_WORKER_CONCURRENCY
        value: "2"
      - key: RECIPE_INGESTION_WORKER_WAKE_MODE
        value: redis
      - key: RECIPE_INGESTION_WORKER_WAKE_TIMEOUT_MS
        value: "15000"
      - key: RECIPE_INGESTION_STALE_AFTER_MINUTES
        value: "15"
      - key: RECIPE_INGESTION_STALE_REPAIR_INTERVAL_MS
        value: "300000"
      - key: RECIPE_INGESTION_SOCIAL_VIDEO_EAGER
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: RECIPE_IMAGE_BUCKET
        sync: false
      - key: RECIPE_IMPORT_MEDIA_BUCKET
        sync: false
  - name: ounje-automation
    type: worker
    runtime: docker
    plan: starter
    dockerfilePath: Dockerfile
    dockerCommand: node server/scripts/automation_worker.mjs --worker-id render_automation_worker --lock-seconds 900 --idle-sleep-ms 15000
    maxShutdownDelaySeconds: 300
    autoDeploy: true
    buildFilter:
      paths:
        - Dockerfile
        - .dockerignore
        - package.json
        - render.yaml
        - server/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: OUNJE_RUNTIME_ENV
        value: production
      - key: AUTOSHOP_MANUAL_BETA_ONLY
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: KROGER_CLIENT_ID
        sync: false
      - key: KROGER_CLIENT_SECRET
        sync: false
      - key: BROWSER_USE_API_KEY
        sync: false
      - key: LUMBOX_API_KEY
        sync: false
      - key: AGENTSIM_API_KEY
        sync: false
      - key: TWO_CAPTCHA_API_KEY
        sync: false
  - name: ounje-recipe-ingestion-health
    type: cron
    runtime: docker
    plan: starter
    schedule: "* * * * *"
    dockerfilePath: Dockerfile
    dockerCommand: node server/scripts/check_recipe_ingestion_worker_health.mjs --max-queued-age-seconds 90
    autoDeploy: true
    buildFilter:
      paths:
        - Dockerfile
        - .dockerignore
        - package.json
        - render.yaml
        - server/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: OUNJE_RUNTIME_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REDIS_URL
        sync: false
